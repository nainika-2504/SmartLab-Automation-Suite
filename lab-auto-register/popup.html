<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lab Auto Register</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>Lab Auto Register</h1>
            <p>Batch patient registration from CSV</p>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel">
            <div class="setting-row">
                <label for="setting-lab">Lab Name</label>
                <select id="setting-lab">
                    <option value="Abhinav Eye & Laser Centre">Abhinav Eye & Laser Centre</option>
                    <option value="Apoorva Centre For Maternity Care">Apoorva Centre For Maternity Care</option>
                    <option value="DNR Diagnostics - Chowtuppal">DNR Diagnostics - Chowtuppal</option>
                    <option value="Genie Diagnostics - Hyderabad">Genie Diagnostics - Hyderabad</option>
                    <option value="Genie Diagnostics - khammam">Genie Diagnostics - khammam</option>
                    <option value="Genie Diagnostics - Narsampet">Genie Diagnostics - Narsampet</option>
                    <option value="Genie Diagnostics - Nirmal">Genie Diagnostics - Nirmal</option>
                    <option value="Genie Diagnostics - Warangal">Genie Diagnostics - Warangal</option>
                    <option value="Glukem Biocare PVT Limit" selected>Glukem Biocare PVT Limit</option>
                    <option value="GRR Diagnostics - Nirmal">GRR Diagnostics - Nirmal</option>
                    <option value="Health Care Diagnostics - Nirmal">Health Care Diagnostics - Nirmal</option>
                    <option value="Isha Heart Care - 2D Echo">Isha Heart Care - 2D Echo</option>
                    <option value="Jhanvika Diagnostics - Nirmal">Jhanvika Diagnostics - Nirmal</option>
                    <option value="Laxmi Diagnostics - Nirmal">Laxmi Diagnostics - Nirmal</option>
                    <option value="Maha Laxmi Lab - Chowtuppal">Maha Laxmi Lab - Chowtuppal</option>
                    <option value="Meghana Hospital - Bhongir">Meghana Hospital - Bhongir</option>
                    <option value="My Labs - Uppal Depot">My Labs - Uppal Depot</option>
                    <option value="New Hope De-Addiction Centre">New Hope De-Addiction Centre</option>
                    <option value="Nimra Diagnostics - Nirmal">Nimra Diagnostics - Nirmal</option>
                    <option value="Para Mount Overeas">Para Mount Overeas</option>
                    <option value="Pradeep Diagnostics - Nirmal">Pradeep Diagnostics - Nirmal</option>
                    <option value="R M R Diagnostics - Chowtuppal">R M R Diagnostics - Chowtuppal</option>
                    <option value="Sai Jyothi Diagnostics - Chowtuppal">Sai Jyothi Diagnostics - Chowtuppal</option>
                    <option value="Sathya Lab - Chowtuppal">Sathya Lab - Chowtuppal</option>
                    <option value="Sidhartha Lab - Chowtuppal">Sidhartha Lab - Chowtuppal</option>
                    <option value="Siri Diagnostics - Nirmal">Siri Diagnostics - Nirmal</option>
                    <option value="Sree Sandhya Lab - Nirmal">Sree Sandhya Lab - Nirmal</option>
                    <option value="Sri Balaji Diagnostics - Ghatkesar">Sri Balaji Diagnostics - Ghatkesar</option>
                    <option value="Sri Balaji Diagnostics - Narayanapuram">Sri Balaji Diagnostics - Narayanapuram</option>
                    <option value="Sri Datta Pathological Lab - Siddipet">Sri Datta Pathological Lab - Siddipet</option>
                    <option value="Sri Harshith Diagnostics - Nirmal">Sri Harshith Diagnostics - Nirmal</option>
                    <option value="Sri Kaatyani Lab - Chowtuppal">Sri Kaatyani Lab - Chowtuppal</option>
                    <option value="Sri Kanta Diagnostics - Nirmal">Sri Kanta Diagnostics - Nirmal</option>
                    <option value="Sri Laxmi Diagnostics - Nirmal">Sri Laxmi Diagnostics - Nirmal</option>
                    <option value="Sri Mithra Diagnostics - Nirmal">Sri Mithra Diagnostics - Nirmal</option>
                    <option value="Sri Sai Lab - Chowtuppal">Sri Sai Lab - Chowtuppal</option>
                    <option value="Sudha Childrens Hospitals - Chowtuppal">Sudha Childrens Hospitals - Chowtuppal</option>
                    <option value="Sudha Diagnostics - Chowtuppal">Sudha Diagnostics - Chowtuppal</option>
                    <option value="SVM Diagnostics - Kanakapur, Nirmal">SVM Diagnostics - Kanakapur, Nirmal</option>
                    <option value="Teja Diagnostics - Nirmal">Teja Diagnostics - Nirmal</option>
                    <option value="Unity Lab - Nirmal">Unity Lab - Nirmal</option>
                    <option value="UV Speciality Lab - Gadwal">UV Speciality Lab - Gadwal</option>
                    <option value="Vasavi Pathological Lab - Nirmal">Vasavi Pathological Lab - Nirmal</option>
                    <option value="Venkata Satya Diagnostics - Nirmal">Venkata Satya Diagnostics - Nirmal</option>
                    <option value="Venkateshwara Diagnostics - Adilabad">Venkateshwara Diagnostics - Adilabad</option>
                    <option value="Vijaya Pathological Lab - Nirmal">Vijaya Pathological Lab - Nirmal</option>
                    <option value="Vinayaka Diagnostics - Uppal Depot">Vinayaka Diagnostics - Uppal Depot</option>
                    <option value="Z R Clinic - Nirmal">Z R Clinic - Nirmal</option>
                </select>
            </div>
            <div class="setting-row">
                <label for="setting-contract">Contract</label>
                <select id="setting-contract">
                    <option value="L To L - A">L To L - A</option>
                    <option value="L To L - B">L To L - B</option>
                    <option value="MRP" selected>MRP</option>
                    <option value="Platinum Card">Platinum Card</option>
                </select>
            </div>
            <div class="setting-row">
                <label for="setting-package">Package</label>
                <select id="setting-package">
                    <option value="Allergy-Comprehensive Profile-A">Allergy-Comprehensive Profile-A</option>
                    <option value="Allergy Profile-B">Allergy Profile-B</option>
                    <option value="Allergy Profile-C">Allergy Profile-C</option>
                    <option value="Allergy profile-D">Allergy profile-D</option>
                    <option value="Allergy Profile-E">Allergy Profile-E</option>
                    <option value="Glukem Health Checkup" selected>Glukem Health Checkup</option>
                    <option value="Health Checkup-C 1.3">Health Checkup-C 1.3</option>
                    <option value="Health Package-B 1.2">Health Package-B 1.2</option>
                    <option value="HepatitisB Marker Profile">HepatitisB Marker Profile</option>
                    <option value="Hypophyseal Cancer-Profile">Hypophyseal Cancer-Profile</option>
                    <option value="Immunity Screening">Immunity Screening</option>
                    <option value="Immuno Check">Immuno Check</option>
                    <option value="Infectious Profile">Infectious Profile</option>
                </select>
            </div>
            <div class="setting-row">
                <label for="setting-doctor">Doctor</label>
                <input type="text" id="setting-doctor" value="Employee Health Checkup" placeholder="Doctor name">
            </div>
        </div>

        <!-- CSV Upload Area -->
        <div class="upload-area" id="upload-area">
            <input type="file" id="csv-upload" accept=".csv,.txt" />
            <label for="csv-upload" class="upload-btn">Choose CSV File</label>
            <div id="file-name" class="file-name">No file chosen</div>
        </div>

        <!-- OR Divider -->
        <div class="divider"><span>OR paste data below</span></div>

        <!-- Manual Entry Textarea -->
        <textarea id="csv-text" class="csv-textarea" placeholder="Name, Age, Gender (one per line)&#10;SAROJANA M, 60, F&#10;RAVI KUMAR, 35, M&#10;PRIYA S, 15, F"></textarea>

        <!-- Patient Preview -->
        <div id="patient-preview" class="patient-preview" style="display:none;">
            <div class="preview-header">
                <span id="patient-count">0 patients</span>
                <button id="clear-btn" class="clear-btn">Clear</button>
            </div>
            <div id="patient-list" class="patient-list"></div>
        </div>

        <!-- Action Buttons -->
        <button id="start-btn" class="primary-btn disabled" disabled>
            <span class="btn-icon">▶</span> Start Registration
        </button>

        <button id="stop-btn" class="stop-btn" style="display:none;">
            ■ Stop
        </button>

        <!-- Status -->
        <div id="status" class="status"></div>

        <!-- Progress Bar -->
        <div id="progress-container" class="progress-container" style="display:none;">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width:0%"></div>
            </div>
            <div id="progress-text" class="progress-text">0 / 0</div>
        </div>

        <!-- Results Panel -->
        <div id="results-panel" class="results-panel" style="display:none;">
            <div class="results-summary-bar">
                <span class="summary-chip chip-filled" id="chip-filled"></span>
                <span class="summary-chip chip-missed" id="chip-missed" style="display:none;"></span>
            </div>
            <div id="results-list" class="results-list"></div>
        </div>

    </div>

    <script src="popup.js"></script>
</body>
</html>
